name: Testing
on:
  push:
    branches: master
  workflow_dispatch:
jobs:
  Test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Interp
        run: haxe test.hxml --interp

      - name: Python
        run: |
          haxe test.hxml -python bin/test.py
          python3 bin/test.py

      - name: Hxcpp
        run: |
          haxelib install hxcpp --quiet
          haxe test.hxml -cpp bin/cpp
          ./bin/cpp/TestAll
